[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wizardgram"
version = "0.1.0"
description = "Async Telegram bot framework for Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "daddymaou", email = "daddymaou@users.noreply.github.com" }]
keywords = ["telegram", "bot", "asyncio", "framework", "telegram-bot-api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "typing-extensions>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]

[project.urls]
Homepage = "https://github.com/daddymaou/wizardgram"
Repository = "https://github.com/daddymaou/wizardgram"
Issues = "https://github.com/daddymaou/wizardgram/issues"
Changelog = "https://github.com/daddymaou/wizardgram/blob/main/CHANGELOG.md"

[project.scripts]
wizardgram = "wizardgram.coverage:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wizardgram"]

[tool.hatch.build.targets.sdist]
include = ["src/wizardgram", "tests", "examples", "docs", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/wizardgram"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/wizardgram"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true